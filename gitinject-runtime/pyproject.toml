[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "attriguard-gitinject-controller"
version = "0.1.0"
description = "Isolated Python 3.13 controller environment for official GitInject"
requires-python = ">=3.13,<3.14"
dependencies = [
  "gitinject==0.1.0",
  "anthropic==0.96.0",
  "click==8.3.1",
  "google-genai==1.67.0",
  "jinja2==3.1.6",
  "openai==2.29.0",
  "pygithub==2.9.0",
  "python-gitlab==8.3.0",
  "pyyaml==6.0.3",
  "requests==2.32.5",
  "rich==14.3.3",
  "tenacity==9.1.4",
]

[tool.setuptools]
packages = []
