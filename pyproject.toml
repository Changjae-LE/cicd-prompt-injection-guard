[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attriguard-gitinject-evaluation"
version = "0.1.0"
description = "Independent evaluation harness for unmodified AttriGuard on a pinned GitInject CI/CD fixture"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = {file = "LICENSE"}
dependencies = [
  "agentdojo==0.1.35",
  "openai>=2.0.0,<3.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

